                  const Divider(),
                  ListTile(leading: const Icon(Icons.star, color: Colors.orange), title: const Text('امتیاز به اپ لند'), onTap: () => ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('ممنون از حمایت شما!'), backgroundColor: Colors.green))),
                  ListTile(leading: const Icon(Icons.share), title: const Text('اشتراک گذاری'), onTap: () => ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('اشتراک گذاری به زودی')))),
                ])),
              );
            }
          }
          DART_END

      - name: Install deps
        run: |
          flutter pub get
          flutter pub add shared_preferences
          flutter pub add url_launcher
          flutter pub add image_picker
          flutter pub add video_player
          flutter pub add just_audio

      - name: Build APK
        run: flutter build apk --release

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/appland.jks

      - name: Sign with apksigner
        run: |
          cd build/app/outputs/flutter-apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks ../../../../android/app/appland.jks --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --key-pass pass:${{ secrets.KEY_ALIAS_PASSWORD }} --ks-key-alias ${{ secrets.KEY_ALIAS }} --out app-release-signed.apk app-release.apk
          mv app-release-signed.apk app-release.apk

      - name: Verify
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: appland-apk
          path: build/app/outputs/flutter-apk/app-release.apk
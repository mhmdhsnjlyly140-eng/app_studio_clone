          class PageEditorPage extends StatefulWidget {
            final AppPage page;
            final Function(AppPage) onSave;
            const PageEditorPage({super.key, required this.page, required this.onSave});
            @override
            State<PageEditorPage> createState() => _PageEditorPageState();
          }
          class _PageEditorPageState extends State<PageEditorPage> {
            late AppPage _page;
            @override
            void initState() { super.initState(); _page = AppPage(name: widget.page.name, elements: List.from(widget.page.elements)); }
            void _addElement(String type) {
              if (type == 'text') {
                final c = TextEditingController();
                showDialog(context: context, builder: (ctx) => AlertDialog(
                  title: const Text('متن جدید'),
                  content: TextField(controller: c, maxLines: 3, decoration: InputDecoration(hintText: 'متن خود را بنویسید', border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)))),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('لغو')),
                    ElevatedButton(onPressed: () { if (c.text.isNotEmpty) { setState(() => _page.elements.add(PageElement(type: 'text', text: c.text))); } Navigator.pop(ctx); }, style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF6A11CB)), child: const Text('افزودن')),
                  ],
                ));
              } else if (type == 'button') {
                final t = TextEditingController();
                final l = TextEditingController();
                showDialog(context: context, builder: (ctx) => AlertDialog(
                  title: const Text('دکمه جدید'),
                  content: Column(mainAxisSize: MainAxisSize.min, children: [
                    TextField(controller: t, decoration: InputDecoration(hintText: 'متن دکمه', border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)))),
                    const SizedBox(height: 12),
                    TextField(controller: l, decoration: InputDecoration(hintText: 'لینک', border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)))),
                  ]),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('لغو')),
                    ElevatedButton(onPressed: () { if (t.text.isNotEmpty) { setState(() => _page.elements.add(PageElement(type: 'button', text: t.text, link: l.text))); } Navigator.pop(ctx); }, style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF6A11CB)), child: const Text('افزودن')),
                  ],
                ));
              } else if (type == 'image') { _pickFile('image'); }
              else if (type == 'video') { _pickFile('video'); }
              else if (type == 'audio') { _pickFile('audio'); }
            }
            Future<void> _pickFile(String type) async {
              final picker = ImagePicker();
              XFile? file;
              if (type == 'image') file = await picker.pickImage(source: ImageSource.gallery);
              else if (type == 'video') file = await picker.pickVideo(source: ImageSource.gallery);
              else if (type == 'audio') file = await picker.pickMedia();
              if (file != null) setState(() => _page.elements.add(PageElement(type: type, imagePath: file!.path, videoPath: file.path, audioPath: file.path)));
            }
            void _moveUp(int i) { if (i > 0) setState(() { final e = _page.elements.removeAt(i); _page.elements.insert(i - 1, e); }); }
            void _moveDown(int i) { if (i < _page.elements.length - 1) setState(() { final e = _page.elements.removeAt(i); _page.elements.insert(i + 1, e); }); }
            void _delete(int i) { setState(() => _page.elements.removeAt(i)); }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(_page.name), backgroundColor: const Color(0xFF6A11CB), foregroundColor: Colors.white,
                  actions: [IconButton(icon: const Icon(Icons.save), onPressed: () { widget.onSave(_page); ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('ذخیره شد'))); })]),
                body: _page.elements.isEmpty
                  ? const Center(child: Text('هنوز المانی اضافه نشده\nاز دکمه های پایین استفاده کنید', textAlign: TextAlign.center, style: TextStyle(fontSize: 16, color: Colors.grey)))
                  : ListView.builder(padding: const EdgeInsets.all(16), itemCount: _page.elements.length, itemBuilder: (c, i) {
                      final e = _page.elements[i];
                      Widget preview;
                      if (e.type == 'text') preview = Text(e.text, style: const TextStyle(fontSize: 16));
                      else if (e.type == 'button') preview = ElevatedButton(onPressed: () {}, style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF6A11CB), foregroundColor: Colors.white), child: Text(e.text));
                      else if (e.type == 'image') preview = Image.file(File(e.imagePath), height: 80, errorBuilder: (_, __, ___) => const Icon(Icons.broken_image));
                      else if (e.type == 'video') preview = const Row(children: [Icon(Icons.video_library), SizedBox(width: 8), Text('ویدیو')]);
                      else if (e.type == 'audio') preview = const Row(children: [Icon(Icons.music_note), SizedBox(width: 8), Text('موزیک')]);
                      else preview = const Text('نامشخص');
                      return Card(margin: const EdgeInsets.only(bottom: 12), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                        child: Padding(padding: const EdgeInsets.all(12), child: Row(children: [
                          Expanded(child: preview),
                          IconButton(icon: const Icon(Icons.arrow_upward, size: 20), onPressed: () => _moveUp(i)),
                          IconButton(icon: const Icon(Icons.arrow_downward, size: 20), onPressed: () => _moveDown(i)),
                          IconButton(icon: const Icon(Icons.delete, color: Colors.red, size: 20), onPressed: () => _delete(i)),
                        ])));
                    }),
                bottomNavigationBar: Container(
                  padding: const EdgeInsets.all(8),
                  child: SingleChildScrollView(scrollDirection: Axis.horizontal, child: Row(children: [
                    ElevatedButton.icon(onPressed: () => _addElement('text'), icon: const Icon(Icons.text_fields, size: 18), label: const Text('متن'), style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF6A11CB), foregroundColor: Colors.white)),
                    const SizedBox(width: 8),
                    ElevatedButton.icon(onPressed: () => _addElement('button'), icon: const Icon(Icons.smart_button, size: 18), label: const Text('دکمه'), style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF6A11CB), foregroundColor: Colors.white)),
                    const SizedBox(width: 8),
                    ElevatedButton.icon(onPressed: () => _addElement('image'), icon: const Icon(Icons.image, size: 18), label: const Text('تصویر'), style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF6A11CB), foregroundColor: Colors.white)),
                    const SizedBox(width: 8),
                    ElevatedButton.icon(onPressed: () => _addElement('video'), icon: const Icon(Icons.video_library, size: 18), label: const Text('فیلم'), style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF6A11CB), foregroundColor: Colors.white)),
                    const SizedBox(width: 8),
                    ElevatedButton.icon(onPressed: () => _addElement('audio'), icon: const Icon(Icons.music_note, size: 18), label: const Text('موزیک'), style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF6A11CB), foregroundColor: Colors.white)),
                  ])),
                ),
              );
            }
          }


          class PageEditorPage extends StatefulWidget {
            final int appIndex;
            final int pageIndex;
            const PageEditorPage({super.key, required this.appIndex, required this.pageIndex});
            @override
            State<PageEditorPage> createState() => _PageEditorPageState();
          }
          class _PageEditorPageState extends State<PageEditorPage> {
            Map<String, dynamic>? _page;
            @override
            void initState() { super.initState(); _load(); }
            Future<void> _load() async {
              final p = await SharedPreferences.getInstance();
              final a = p.getStringList('my_apps') ?? [];
              if (widget.appIndex < a.length) {
                final app = jsonDecode(a[widget.appIndex]) as Map<String, dynamic>;
                final pages = List.from(app['pages'] ?? []);
                if (widget.pageIndex < pages.length) {
                  setState(() => _page = Map<String, dynamic>.from(pages[widget.pageIndex]));
                }
              }
            }
            Future<void> _save() async {
              if (_page == null) return;
              final p = await SharedPreferences.getInstance();
              final a = p.getStringList('my_apps') ?? [];
              final app = jsonDecode(a[widget.appIndex]) as Map<String, dynamic>;
              final pages = List.from(app['pages'] ?? []);
              pages[widget.pageIndex] = _page;
              app['pages'] = pages;
              a[widget.appIndex] = jsonEncode(app);
              await p.setStringList('my_apps', a);
            }
            void _addElement(String type) {
              final elements = List.from(_page!['elements'] ?? []);
              elements.add({'id': DateTime.now().millisecondsSinceEpoch.toString(), 'type': type, 'text': '', 'link': '', 'mediaPath': '', 'color': 0xFF6A11CB, 'items': []});
              _page!['elements'] = elements;
              setState(() {});
              _save();
            }
            void _deleteElement(int i) {
              final elements = List.from(_page!['elements'] ?? []);
              elements.removeAt(i);
              _page!['elements'] = elements;
              setState(() {});
              _save();
            }
            void _moveElement(int i, int delta) {
              final elements = List.from(_page!['elements'] ?? []);
              if (i + delta < 0 || i + delta >= elements.length) return;
              final temp = elements[i];
              elements[i] = elements[i + delta];
              elements[i + delta] = temp;
              _page!['elements'] = elements;
              setState(() {});
              _save();
            }
            @override
            Widget build(BuildContext context) {
              if (_page == null) return const Scaffold(body: Center(child: CircularProgressIndicator()));
              final elements = (_page!['elements'] as List? ?? []);
              return Scaffold(
                appBar: AppBar(
                  title: Text(_page!['name'] ?? ''),
                  backgroundColor: const Color(0xFF6A11CB),
                  foregroundColor: Colors.white,
                ),
                body: elements.isEmpty
                  ? const Center(child: Text('هنوز المانی اضافه نشده\nاز دکمه های پایین استفاده کنید', textAlign: TextAlign.center, style: TextStyle(fontSize: 16, color: Colors.grey)))
                  : ListView.builder(
                      padding: const EdgeInsets.all(16),
                      itemCount: elements.length,
                      itemBuilder: (c, i) {
                        final el = elements[i];
                        return Card(
                          margin: const EdgeInsets.only(bottom: 12),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),
                          child: ListTile(
                            leading: Icon(_iconForType(el['type']), color: const Color(0xFF6A11CB)),
                            title: Text(_labelForType(el['type'])),
                            subtitle: Text(el['text'] ?? el['link'] ?? ''),
                            trailing: Row(mainAxisSize: MainAxisSize.min, children: [
                              IconButton(icon: const Icon(Icons.arrow_upward, size: 20), onPressed: () => _moveElement(i, -1)),
                              IconButton(icon: const Icon(Icons.arrow_downward, size: 20), onPressed: () => _moveElement(i, 1)),
                              IconButton(icon: const Icon(Icons.delete, color: Colors.red, size: 20), onPressed: () => _deleteElement(i)),
                            ]),
                          ),
                        );
                      },
                    ),
                bottomNavigationBar: Container(
                  padding: const EdgeInsets.all(10),
                  decoration: BoxDecoration(
                    color: Theme.of(context).cardColor,
                    boxShadow: [BoxShadow(color: Colors.black.withOpacity(0.1), blurRadius: 10, offset: const Offset(0, -3))],
                  ),
                  child: SingleChildScrollView(
                    scrollDirection: Axis.horizontal,
                    child: Row(children: [
                      _elementBtn(Icons.text_fields, 'متن', 'text'),
                      _elementBtn(Icons.smart_button, 'دکمه', 'button'),
                      _elementBtn(Icons.image, 'تصویر', 'image'),
                      _elementBtn(Icons.video_library, 'فیلم', 'video'),
                      _elementBtn(Icons.music_note, 'موزیک', 'audio'),
                      _elementBtn(Icons.navigation, 'منوی پایین', 'bottomnav'),
                      _elementBtn(Icons.menu, 'منوی کشویی', 'drawer'),
                      _elementBtn(Icons.arrow_forward, 'صفحه بعد', 'nextpage'),
                      _elementBtn(Icons.payment, 'پرداخت', 'purchase'),
                    ]),
                  ),
                ),
              );
            }
            Widget _elementBtn(IconData icon, String label, String type) {
              return Padding(
                padding: const EdgeInsets.only(right: 8),
                child: ElevatedButton.icon(
                  onPressed: () => _addElement(type),
                  icon: Icon(icon, size: 18),
                  label: Text(label, style: const TextStyle(fontSize: 13)),
                  style: ElevatedButton.styleFrom(
                    backgroundColor: const Color(0xFF6A11CB),
                    foregroundColor: Colors.white,
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                  ),
                ),
              );
            }
            IconData _iconForType(String? type) {
              switch (type) {
                case 'text': return Icons.text_fields;
                case 'button': return Icons.smart_button;
                case 'image': return Icons.image;
                case 'video': return Icons.video_library;
                case 'audio': return Icons.music_note;
                case 'bottomnav': return Icons.navigation;
                case 'drawer': return Icons.menu;
                case 'nextpage': return Icons.arrow_forward;
                case 'purchase': return Icons.payment;
                default: return Icons.widgets;
              }
            }
            String _labelForType(String? type) {
              switch (type) {
                case 'text': return 'متن';
                case 'button': return 'دکمه';
                case 'image': return 'تصویر';
                case 'video': return 'فیلم';
                case 'audio': return 'موزیک';
                case 'bottomnav': return 'منوی پایین';
                case 'drawer': return 'منوی کشویی';
                case 'nextpage': return 'دکمه صفحه بعد';
                case 'purchase': return 'دکمه پرداخت';
                default: return 'نامشخص';
              }
            }
          }


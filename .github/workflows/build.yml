name: Build and Distribute APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0'
        channel: 'stable'

    - name: Create Flutter project
      run: |
        # ذخیره کد اپ‌لند قبل از پاک شدن
        cp lib/main.dart /tmp/main_backup.dart 2>/dev/null || true
        find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;
        flutter create --org com.appland --project-name appland .
        # برگرداندن کد اپ‌لند
        cp /tmp/main_backup.dart lib/main.dart 2>/dev/null || true

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK (Release)
      run: flutter build apk --release

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: appland-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7

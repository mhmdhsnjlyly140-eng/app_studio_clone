          DART_EOF
      - name: Install Deps
        run: |
          flutter pub get
          flutter pub add shared_preferences
          flutter pub add url_launcher
          flutter pub add image_picker
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/appland.jks
      - name: Sign APK
        run: |
          cd build/app/outputs/flutter-apk
          zip -d app-release.apk "META-INF/*.SF" "META-INF/*.DSA" "META-INF/*.RSA" || true
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore ../../../../android/app/appland.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_ALIAS_PASSWORD }} app-release.apk ${{ secrets.KEY_ALIAS }}
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 app-release.apk app-release-aligned.apk
          mv app-release-aligned.apk app-release.apk
      - name: Verify
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: appland-apk
          path: build/app/outputs/flutter-apk/app-release.apk
              final p = await SharedPreferences.getInstance();
              final a = p.getStringList('my_apps') ?? [];
              if (widget.appIndex < a.length) {
                setState(() {
                  _app = jsonDecode(a[widget.appIndex]) as Map<String, dynamic>;
                  _rsaCtrl.text = _app!['rsaKey'] ?? '';

name: Build AppLand APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'
          channel: 'stable'

      - name: Create Flutter project
        run: |
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;
          flutter create --org ir.appland --project-name jalili .

      - name: Set up MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/ir/appland/jalili
          cat > android/app/src/main/kotlin/ir/appland/jalili/MainActivity.kt << 'KOTLIN_EOF'
          package ir.appland.jalili
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity: FlutterFragmentActivity()
          KOTLIN_EOF

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          ls -la android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_ALIAS_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
          cat android/key.properties

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub add shared_preferences
          flutter pub add url_launcher
          flutter pub add image_picker

      - name: Build APK with manual signing
        run: |
          # ۱. ساخت APK بدون امضا
          flutter build apk --release
          
          # ۲. پیدا کردن فایل APK
          APK_DIR=build/app/outputs/flutter-apk
          UNSIGNED_APK=$APK_DIR/app-release.apk
          
          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "APK not found!"
            ls -la $APK_DIR
            exit 1
          fi
          
          # ۳. حذف امضای دیباگ
          zip -d $UNSIGNED_APK "META-INF/*.SF" || true
          zip -d $UNSIGNED_APK "META-INF/*.DSA" || true
          zip -d $UNSIGNED_APK "META-INF/*.RSA" || true
          
          # ۴. امضا با کلید اختصاصی
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore android/app/keystore.jks \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_ALIAS_PASSWORD }} \
            $UNSIGNED_APK \
            ${{ secrets.KEY_ALIAS }}
          
          # ۵. زیپ‌الاین
          $ANDROID_HOME/build-tools/35.0.0/zipalign -v 4 \
            $UNSIGNED_APK \
            $APK_DIR/app-release-signed.apk
          
          # ۶. جایگزینی APK اصلی با نسخه امضا شده
          mv $APK_DIR/app-release-signed.apk $UNSIGNED_APK

      - name: Verify APK Signature
        run: |
          echo "=== بررسی امضای APK ==="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk || true

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appland-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
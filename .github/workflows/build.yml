name: Build AppLand APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      - name: Create Flutter project
        run: |
          rm -rf lib android ios web test .dart_tool build pubspec.yaml pubspec.lock analysis_options.yaml .metadata
          flutter create --org ir.appland --project-name jalili --platforms android .
      - name: Write main.dart
        run: |
          cat > lib/main.dart << 'DART_END'
          import 'package:flutter/material.dart';

          void main() => runApp(const AppLand());

          class AppLand extends StatelessWidget {
            const AppLand({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'اپ لند',
                theme: ThemeData(primarySwatch: Colors.deepPurple, useMaterial3: true),
                home: const SplashScreen(),
              );
            }
          }

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }
          class _SplashScreenState extends State<SplashScreen> {
            @override
            void initState() {
              super.initState();
              Future.delayed(const Duration(seconds: 3), () {
                if (mounted) Navigator.of(context).pushReplacement(MaterialPageRoute(builder: (_) => const MainScreen()));
              });
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(body: Container(
                decoration: const BoxDecoration(gradient: LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter, colors: [Color(0xFF6A11CB), Color(0xFF2575FC)])),
                child: const Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                  Icon(Icons.apps, size: 100, color: Colors.white),
                  SizedBox(height: 20),
                  Text('اپ لند', style: TextStyle(fontSize: 42, fontWeight: FontWeight.bold, color: Colors.white)),
                  SizedBox(height: 10),
                  Text('سرزمین اپ های تو', style: TextStyle(fontSize: 18, color: Colors.white70)),
                ])),
              ));
            }
          }

          class MainScreen extends StatefulWidget {
            const MainScreen({super.key});
            @override
            State<MainScreen> createState() => _MainScreenState();
          }
          class _MainScreenState extends State<MainScreen> {
            int _i = 0;
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(child: Text('صفحه ${_i + 1}', style: const TextStyle(fontSize: 30))),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: _i,
                  onDestinationSelected: (i) => setState(() => _i = i),
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.home), label: 'خانه'),
                    NavigationDestination(icon: Icon(Icons.apps), label: 'اپ ها'),
                    NavigationDestination(icon: Icon(Icons.add), label: 'ساخت'),
                    NavigationDestination(icon: Icon(Icons.settings), label: 'تنظیمات'),
                  ],
                ),
              );
            }
          }
          DART_END
      - name: Install deps
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/appland.jks
      - name: Sign APK
        run: |
          cd build/app/outputs/flutter-apk
          zip -d app-release.apk "META-INF/*.SF" "META-INF/*.DSA" "META-INF/*.RSA" || true
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore ../../../../android/app/appland.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_ALIAS_PASSWORD }} app-release.apk ${{ secrets.KEY_ALIAS }}
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 app-release.apk app-release-aligned.apk
          mv app-release-aligned.apk app-release.apk
      - name: Verify
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: appland-apk
          path: build/app/outputs/flutter-apk/app-release.apk
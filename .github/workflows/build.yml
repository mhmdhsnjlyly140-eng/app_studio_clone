name: Build AppLand APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0'
        channel: 'stable'

    - name: Create Flutter project
      run: |
        find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;
        flutter create --org com.appland --project-name appland .

    - name: Install dependencies
      run: |
        flutter pub get
        flutter pub add shared_preferences
        flutter pub add flutter_launcher_icons
        flutter pub add flutter_native_splash

    - name: Create App Icon
      run: |
        mkdir -p assets
        cat > assets/icon.svg << 'SVG_EOF'
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#6A11CB"/>
              <stop offset="100%" style="stop-color:#2575FC"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="100" fill="url(#grad)"/>
          <rect x="140" y="140" width="80" height="80" rx="15" fill="white"/>
          <rect x="230" y="140" width="80" height="80" rx="15" fill="white"/>
          <rect x="320" y="140" width="80" height="80" rx="15" fill="white"/>
          <rect x="140" y="230" width="80" height="80" rx="15" fill="white"/>
          <rect x="230" y="230" width="80" height="80" rx="15" fill="white"/>
          <rect x="320" y="230" width="80" height="80" rx="15" fill="white"/>
          <rect x="140" y="320" width="80" height="80" rx="15" fill="white"/>
          <rect x="230" y="320" width="80" height="80" rx="15" fill="white"/>
          <rect x="320" y="320" width="80" height="80" rx="15" fill="white"/>
        </svg>
        SVG_EOF

    - name: Configure App Icon
      run: |
        cat > flutter_launcher_icons.yaml << 'ICON_EOF'
        flutter_launcher_icons:
          android: "launcher_icon"
          ios: true
          image_path: "assets/icon.svg"
          min_sdk_android: 21
        ICON_EOF
        dart run flutter_launcher_icons || true

    - name: Configure Splash Screen
      run: |
        cat > flutter_native_splash.yaml << 'SPLASH_EOF'
        flutter_native_splash:
          color: "#6A11CB"
          image: "assets/icon.svg"
          android: true
          ios: true
          android_12:
            color: "#6A11CB"
            image: "assets/icon.svg"
        SPLASH_EOF
        dart run flutter_native_splash:create || true

    - name: Write AppLand main.dart
      run: |
        cat > lib/main.dart << 'DART_EOF'
        import 'package:flutter/material.dart';
        import 'package:shared_preferences/shared_preferences.dart';
        import 'dart:convert';

        void main() {
          runApp(const AppLand());
        }

        class AppLand extends StatelessWidget {
          const AppLand({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'اپ‌لند',
              theme: ThemeData(
                primarySwatch: Colors.deepPurple,
                useMaterial3: true,
              ),
              home: const SplashScreen(),
            );
          }
        }

        // ==================== Splash Screen ====================
        class SplashScreen extends StatefulWidget {
          const SplashScreen({super.key});

          @override
          State<SplashScreen> createState() => _SplashScreenState();
        }

        class _SplashScreenState extends State<SplashScreen>
            with SingleTickerProviderStateMixin {
          late AnimationController _controller;
          late Animation<double> _fadeAnimation;
          late Animation<double> _scaleAnimation;

          @override
          void initState() {
            super.initState();
            _controller = AnimationController(
              vsync: this,
              duration: const Duration(milliseconds: 1500),
            );
            _fadeAnimation = Tween<double>(begin: 0.0, end: 1.0).animate(
              CurvedAnimation(parent: _controller, curve: Curves.easeIn),
            );
            _scaleAnimation = Tween<double>(begin: 0.5, end: 1.0).animate(
              CurvedAnimation(parent: _controller, curve: Curves.elasticOut),
            );
            _controller.forward();

            Future.delayed(const Duration(seconds: 3), () {
              if (mounted) {
                Navigator.of(context).pushReplacement(
                  MaterialPageRoute(builder: (_) => const MainScreen()),
                );
              }
            });
          }

          @override
          void dispose() {
            _controller.dispose();
            super.dispose();
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: Container(
                decoration: const BoxDecoration(
                  gradient: LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [Color(0xFF6A11CB), Color(0xFF2575FC)],
                  ),
                ),
                child: Center(
                  child: FadeTransition(
                    opacity: _fadeAnimation,
                    child: ScaleTransition(
                      scale: _scaleAnimation,
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          Container(
                            width: 140,
                            height: 140,
                            decoration: BoxDecoration(
                              color: Colors.white,
                              borderRadius: BorderRadius.circular(35),
                              boxShadow: [
                                BoxShadow(
                                  color: Colors.black.withOpacity(0.3),
                                  blurRadius: 30,
                                  spreadRadius: 10,
                                ),
                              ],
                            ),
                            child: const Icon(
                              Icons.apps,
                              size: 80,
                              color: Color(0xFF6A11CB),
                            ),
                          ),
                          const SizedBox(height: 30),
                          const Text(
                            'اپ‌لند',
                            style: TextStyle(
                              fontSize: 42,
                              fontWeight: FontWeight.bold,
                              color: Colors.white,
                              letterSpacing: 3,
                            ),
                          ),
                          const SizedBox(height: 10),
                          const Text(
                            'سرزمین اپ‌های تو',
                            style: TextStyle(
                              fontSize: 16,
                              color: Colors.white70,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              ),
            );
          }
        }

        class MainScreen extends StatefulWidget {
          const MainScreen({super.key});

          @override
          State<MainScreen> createState() => _MainScreenState();
        }

        class _MainScreenState extends State<MainScreen> {
          int _currentIndex = 0;

          @override
          Widget build(BuildContext context) {
            final pages = [
              const HomePage(),
              const MyAppsPage(),
              CreateAppPage(
                onAppCreated: () {
                  setState(() {
                    _currentIndex = 1;
                  });
                },
              ),
              const SettingsPage(),
            ];

            return Scaffold(
              body: pages[_currentIndex],
              bottomNavigationBar: NavigationBar(
                selectedIndex: _currentIndex,
                onDestinationSelected: (index) {
                  setState(() {
                    _currentIndex = index;
                  });
                },
                destinations: const [
                  NavigationDestination(
                    icon: Icon(Icons.home_outlined),
                    selectedIcon: Icon(Icons.home),
                    label: 'خانه',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.apps_outlined),
                    selectedIcon: Icon(Icons.apps),
                    label: 'اپ‌های من',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.add_circle_outline),
                    selectedIcon: Icon(Icons.add_circle),
                    label: 'ساخت اپ',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.settings_outlined),
                    selectedIcon: Icon(Icons.settings),
                    label: 'تنظیمات',
                  ),
                ],
              ),
            );
          }
        }

        // ==================== مدل اپ ====================
        class MyAppModel {
          final String name;
          final String welcome;
          final int colorValue;

          MyAppModel({
            required this.name,
            required this.welcome,
            required this.colorValue,
          });

          Map<String, dynamic> toJson() => {
                'name': name,
                'welcome': welcome,
                'color': colorValue,
              };

          factory MyAppModel.fromJson(Map<String, dynamic> json) => MyAppModel(
                name: json['name'],
                welcome: json['welcome'],
                colorValue: json['color'],
              );
        }

        // ==================== صفحه خانه ====================
        class HomePage extends StatelessWidget {
          const HomePage({super.key});

          @override
          Widget build(BuildContext context) {
            return Container(
              decoration: const BoxDecoration(
                gradient: LinearGradient(
                  begin: Alignment.topCenter,
                  end: Alignment.bottomCenter,
                  colors: [Color(0xFF6A11CB), Color(0xFF2575FC)],
                ),
              ),
              child: SafeArea(
                child: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Container(
                        width: 120,
                        height: 120,
                        decoration: BoxDecoration(
                          color: Colors.white,
                          borderRadius: BorderRadius.circular(30),
                          boxShadow: [
                            BoxShadow(
                              color: Colors.black.withOpacity(0.2),
                              blurRadius: 20,
                              spreadRadius: 5,
                            ),
                          ],
                        ),
                        child: const Icon(
                          Icons.apps,
                          size: 70,
                          color: Color(0xFF6A11CB),
                        ),
                      ),
                      const SizedBox(height: 30),
                      const Text(
                        'اپ‌لند',
                        style: TextStyle(
                          fontSize: 48,
                          fontWeight: FontWeight.bold,
                          color: Colors.white,
                          letterSpacing: 2,
                        ),
                      ),
                      const SizedBox(height: 10),
                      const Text(
                        'سرزمین اپ‌های تو',
                        style: TextStyle(
                          fontSize: 18,
                          color: Colors.white70,
                        ),
                      ),
                      const SizedBox(height: 50),
                      ElevatedButton(
                        onPressed: () {
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(
                              content: Text('به اپ‌لند خوش آمدید! 🚀'),
                            ),
                          );
                        },
                        style: ElevatedButton.styleFrom(
                          backgroundColor: Colors.white,
                          foregroundColor: const Color(0xFF6A11CB),
                          padding: const EdgeInsets.symmetric(
                            horizontal: 50,
                            vertical: 18,
                          ),
                          shape: RoundedRectangleBorder(
                            borderRadius: BorderRadius.circular(30),
                          ),
                        ),
                        child: const Text(
                          'شروع کنید',
                          style: TextStyle(
                            fontSize: 20,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ),
                      const SizedBox(height: 20),
                      const Text(
                        'نسخه ۱.۰.۰',
                        style: TextStyle(
                          fontSize: 14,
                          color: Colors.white54,
                        ),
                      ),
                    ],
                  ),
                ),
              ),
            );
          }
        }

        // ==================== صفحه اپ‌های من ====================
        class MyAppsPage extends StatefulWidget {
          const MyAppsPage({super.key});

          @override
          State<MyAppsPage> createState() => _MyAppsPageState();
        }

        class _MyAppsPageState extends State<MyAppsPage> {
          List<MyAppModel> _apps = [];
          bool _isLoading = true;

          @override
          void initState() {
            super.initState();
            _loadApps();
          }

          Future<void> _loadApps() async {
            final prefs = await SharedPreferences.getInstance();
            final appsJson = prefs.getStringList('my_apps') ?? [];
            setState(() {
              _apps = appsJson
                  .map((e) => MyAppModel.fromJson(jsonDecode(e)))
                  .toList();
              _isLoading = false;
            });
          }

          Future<void> _deleteApp(int index) async {
            final prefs = await SharedPreferences.getInstance();
            final appsJson = prefs.getStringList('my_apps') ?? [];
            appsJson.removeAt(index);
            await prefs.setStringList('my_apps', appsJson);
            _loadApps();
          }

          void _showBuildDialog(MyAppModel app) {
            showDialog(
              context: context,
              builder: (context) => AlertDialog(
                title: const Text('ساخت APK'),
                content: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    const Icon(Icons.build, size: 60, color: Color(0xFF6A11CB)),
                    const SizedBox(height: 16),
                    Text('آیا می‌خواهید APK اپ «${app.name}» ساخته شود؟'),
                    const SizedBox(height: 16),
                    const Text(
                      'این فرآیند از طریق GitHub Actions انجام می‌شود.',
                      style: TextStyle(fontSize: 12, color: Colors.grey),
                    ),
                  ],
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(context),
                    child: const Text('لغو'),
                  ),
                  ElevatedButton(
                    onPressed: () {
                      Navigator.pop(context);
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(
                          content: Text('درخواست ساخت APK ارسال شد! 🚀'),
                        ),
                      );
                    },
                    style: ElevatedButton.styleFrom(
                      backgroundColor: const Color(0xFF6A11CB),
                    ),
                    child: const Text('بساز'),
                  ),
                ],
              ),
            );
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('اپ‌های من'),
                backgroundColor: const Color(0xFF6A11CB),
                foregroundColor: Colors.white,
              ),
              body: _isLoading
                  ? const Center(child: CircularProgressIndicator())
                  : _apps.isEmpty
                      ? const Center(
                          child: Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              Icon(Icons.apps, size: 80, color: Colors.grey),
                              SizedBox(height: 20),
                              Text(
                                'هنوز اپی نساخته‌اید',
                                style: TextStyle(
                                    fontSize: 18, color: Colors.grey),
                              ),
                              SizedBox(height: 10),
                              Text(
                                'از تب «ساخت اپ» شروع کنید',
                                style: TextStyle(
                                    fontSize: 14, color: Colors.grey),
                              ),
                            ],
                          ),
                        )
                      : ListView.builder(
                          padding: const EdgeInsets.all(16),
                          itemCount: _apps.length,
                          itemBuilder: (context, index) {
                            final app = _apps[index];
                            return Card(
                              margin: const EdgeInsets.only(bottom: 12),
                              shape: RoundedRectangleBorder(
                                borderRadius: BorderRadius.circular(16),
                              ),
                              child: ListTile(
                                leading: Container(
                                  width: 50,
                                  height: 50,
                                  decoration: BoxDecoration(
                                    color: Color(app.colorValue),
                                    borderRadius: BorderRadius.circular(12),
                                  ),
                                  child: const Icon(
                                    Icons.apps,
                                    color: Colors.white,
                                  ),
                                ),
                                title: Text(
                                  app.name,
                                  style: const TextStyle(
                                    fontWeight: FontWeight.bold,
                                    fontSize: 16,
                                  ),
                                ),
                                subtitle: Text(app.welcome),
                                trailing: Row(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    IconButton(
                                      icon: const Icon(Icons.build,
                                          color: Color(0xFF6A11CB)),
                                      onPressed: () => _showBuildDialog(app),
                                    ),
                                    IconButton(
                                      icon: const Icon(Icons.delete,
                                          color: Colors.red),
                                      onPressed: () => _deleteApp(index),
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        ),
            );
          }
        }

        // ==================== صفحه ساخت اپ ====================
        class CreateAppPage extends StatefulWidget {
          final VoidCallback onAppCreated;

          const CreateAppPage({super.key, required this.onAppCreated});

          @override
          State<CreateAppPage> createState() => _CreateAppPageState();
        }

        class _CreateAppPageState extends State<CreateAppPage> {
          final _appNameController = TextEditingController();
          final _welcomeController = TextEditingController();
          Color _selectedColor = const Color(0xFF6A11CB);
          bool _isLoading = false;

          final List<Color> _colors = [
            const Color(0xFF6A11CB),
            const Color(0xFF2575FC),
            const Color(0xFFFF6B6B),
            const Color(0xFF4ECDC4),
            const Color(0xFFFFA500),
            const Color(0xFF9B59B6),
          ];

          @override
          void dispose() {
            _appNameController.dispose();
            _welcomeController.dispose();
            super.dispose();
          }

          Future<void> _saveApp() async {
            if (_appNameController.text.isEmpty) {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('لطفاً نام اپ را وارد کنید')),
              );
              return;
            }

            setState(() {
              _isLoading = true;
            });

            final prefs = await SharedPreferences.getInstance();
            final appsJson = prefs.getStringList('my_apps') ?? [];

            final newApp = MyAppModel(
              name: _appNameController.text,
              welcome: _welcomeController.text.isEmpty
                  ? 'به ${_appNameController.text} خوش آمدید'
                  : _welcomeController.text,
              colorValue: _selectedColor.value,
            );

            appsJson.add(jsonEncode(newApp.toJson()));
            await prefs.setStringList('my_apps', appsJson);

            setState(() {
              _isLoading = false;
            });

            if (mounted) {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text('اپ «${_appNameController.text}» ساخته شد! 🎉'),
                ),
              );
              _appNameController.clear();
              _welcomeController.clear();
              widget.onAppCreated();
            }
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('ساخت اپ جدید'),
                backgroundColor: const Color(0xFF6A11CB),
                foregroundColor: Colors.white,
              ),
              body: SingleChildScrollView(
                padding: const EdgeInsets.all(20),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    const Text(
                      'نام اپ',
                      style:
                          TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 8),
                    TextField(
                      controller: _appNameController,
                      decoration: InputDecoration(
                        hintText: 'مثلاً: فروشگاه من',
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                        prefixIcon: const Icon(Icons.apps),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text(
                      'پیام خوش‌آمدگویی',
                      style:
                          TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 8),
                    TextField(
                      controller: _welcomeController,
                      decoration: InputDecoration(
                        hintText: 'مثلاً: به فروشگاه من خوش آمدید',
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                        prefixIcon: const Icon(Icons.message),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text(
                      'رنگ اپ',
                      style:
                          TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 12),
                    Wrap(
                      spacing: 12,
                      runSpacing: 12,
                      children: _colors.map((color) {
                        return GestureDetector(
                          onTap: () {
                            setState(() {
                              _selectedColor = color;
                            });
                          },
                          child: Container(
                            width: 50,
                            height: 50,
                            decoration: BoxDecoration(
                              color: color,
                              shape: BoxShape.circle,
                              border: Border.all(
                                color: _selectedColor == color
                                    ? Colors.black
                                    : Colors.transparent,
                                width: 3,
                              ),
                            ),
                            child: _selectedColor == color
                                ? const Icon(Icons.check,
                                    color: Colors.white)
                                : null,
                          ),
                        );
                      }).toList(),
                    ),
                    const SizedBox(height: 30),
                    ElevatedButton(
                      onPressed: _isLoading ? null : _saveApp,
                      style: ElevatedButton.styleFrom(
                        backgroundColor: _selectedColor,
                        foregroundColor: Colors.white,
                        padding: const EdgeInsets.symmetric(vertical: 16),
                        shape: RoundedRectangleBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                      ),
                      child: _isLoading
                          ? const SizedBox(
                              height: 24,
                              width: 24,
                              child: CircularProgressIndicator(
                                color: Colors.white,
                                strokeWidth: 2,
                              ),
                            )
                          : const Text(
                              'ساخت اپ',
                              style: TextStyle(
                                fontSize: 18,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                    ),
                  ],
                ),
              ),
            );
          }
        }

        // ==================== صفحه تنظیمات ====================
        class SettingsPage extends StatelessWidget {
          const SettingsPage({super.key});

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('تنظیمات'),
                backgroundColor: const Color(0xFF6A11CB),
                foregroundColor: Colors.white,
              ),
              body: ListView(
                children: const [
                  ListTile(
                    leading: Icon(Icons.person),
                    title: Text('حساب کاربری'),
                    trailing: Icon(Icons.arrow_forward_ios, size: 16),
                  ),
                  ListTile(
                    leading: Icon(Icons.color_lens),
                    title: Text('رنگ‌بندی اپ'),
                    trailing: Icon(Icons.arrow_forward_ios, size: 16),
                  ),
                  ListTile(
                    leading: Icon(Icons.language),
                    title: Text('زبان'),
                    trailing: Icon(Icons.arrow_forward_ios, size: 16),
                  ),
                  ListTile(
                    leading: Icon(Icons.info),
                    title: Text('درباره اپ‌لند'),
                    trailing: Icon(Icons.arrow_forward_ios, size: 16),
                  ),
                  Divider(),
                  ListTile(
                    leading: Icon(Icons.star, color: Colors.orange),
                    title: Text('امتیاز به اپ‌لند'),
                  ),
                  ListTile(
                    leading: Icon(Icons.share),
                    title: Text('اشتراک‌گذاری'),
                  ),
                ],
              ),
            );
          }
        }
        DART_EOF

    - name: Build APK (Release)
      run: flutter build apk --release

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: appland-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7
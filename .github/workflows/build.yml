                content: const Text('برای فعال سازی تبلیغات و پرداخت این اپ، مبلغ ۱۹۹,۰۰۰ تومان پرداخت کنید.'),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(c), child: const Text('لغو')),
                  ElevatedButton(
                    onPressed: () async {
                      Navigator.pop(c);
                      await _purchaseThisApp();

name: Build AppLand APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'
          channel: 'stable'

      - name: Save main.dart and create Flutter project
        run: |
          mkdir -p /tmp/appland_source
          cp lib/main.dart /tmp/appland_source/main.dart
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;
          flutter create --org ir.appland --project-name jalili .
          cp /tmp/appland_source/main.dart lib/main.dart

      - name: Set up MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/ir/appland/jalili
          cat > android/app/src/main/kotlin/ir/appland/jalili/MainActivity.kt << 'KOTLIN_EOF'
          package ir.appland.jalili
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity: FlutterFragmentActivity()
          KOTLIN_EOF

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android/app/appland.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias appland \
            -storepass appland123 \
            -keypass appland123 \
            -dname "CN=AppLand, OU=AppLand, O=AppLand, L=Tehran, ST=Tehran, C=IR"
          ls -la android/app/appland.jks

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub add shared_preferences
          flutter pub add url_launcher
          flutter pub add image_picker

      - name: Build unsigned APK
        run: |
          flutter build apk --release
          ls -la build/app/outputs/flutter-apk/

      - name: Sign APK
        run: |
          APK_DIR=build/app/outputs/flutter-apk
          APK=$APK_DIR/app-release.apk
          
          zip -d $APK "META-INF/*.SF" || true
          zip -d $APK "META-INF/*.DSA" || true
          zip -d $APK "META-INF/*.RSA" || true
          
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore android/app/appland.jks \
            -storepass appland123 \
            -keypass appland123 \
            $APK \
            appland

      - name: Verify APK Signature
        run: |
          echo "=== بررسی امضای APK ==="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: appland-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
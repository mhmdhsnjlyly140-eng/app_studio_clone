                const SizedBox(height: 24),
                ElevatedButton.icon(
                  onPressed: _save,
                  icon: const Icon(Icons.save),
                  label: const Text('ذخیره اطلاعات پرداخت'),
                  style: ElevatedButton.styleFrom(
                    backgroundColor: const Color(0xFF6A11CB),
                    foregroundColor: Colors.white,
                    padding: const EdgeInsets.symmetric(vertical: 14),
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),
                  ),
                ),
                const SizedBox(height: 20),
                Card(
                  color: Colors.amber.shade50,
                  child: const Padding(
                    padding: EdgeInsets.all(16),
                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Row(children: [Icon(Icons.info, color: Colors.amber), SizedBox(width: 8), Text('راهنما', style: TextStyle(fontWeight: FontWeight.bold))]),
                      SizedBox(height: 8),
                      Text('۱. توی پنل کافه بازار، یه محصول بساز', style: TextStyle(fontSize: 13)),
                      Text('۲. کلید RSA رو از پنل کپی کن', style: TextStyle(fontSize: 13)),
                      Text('۳. شناسه محصول (SKU) رو وارد کن', style: TextStyle(fontSize: 13)),
                      Text('۴. ذخیره کن تا توی اپ نهایی اعمال بشه', style: TextStyle(fontSize: 13)),

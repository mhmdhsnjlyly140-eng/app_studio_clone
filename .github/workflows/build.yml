name: Build AppLand APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0'
        channel: 'stable'

    - name: Create Flutter project
      run: |
        find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;
        flutter create --org com.appland --project-name appland .

    - name: Install dependencies
      run: |
        flutter pub get
        flutter pub add shared_preferences
        flutter pub add url_launcher

    - name: Write AppLand main.dart
      run: |
        cat > lib/main.dart << 'DART_EOF'
        import 'package:flutter/material.dart';
        import 'package:shared_preferences/shared_preferences.dart';
        import 'package:url_launcher/url_launcher.dart';
        import 'dart:convert';

        void main() {
          runApp(const AppLand());
        }

        class AppLand extends StatelessWidget {
          const AppLand({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'اپ‌لند',
              theme: ThemeData(
                primarySwatch: Colors.deepPurple,
                useMaterial3: true,
              ),
              home: const SplashScreen(),
            );
          }
        }

        // ==================== Splash Screen ====================
        class SplashScreen extends StatefulWidget {
          const SplashScreen({super.key});

          @override
          State<SplashScreen> createState() => _SplashScreenState();
        }

        class _SplashScreenState extends State<SplashScreen>
            with SingleTickerProviderStateMixin {
          late AnimationController _controller;
          late Animation<double> _fadeAnimation;
          late Animation<double> _scaleAnimation;

          @override
          void initState() {
            super.initState();
            _controller = AnimationController(
              vsync: this,
              duration: const Duration(milliseconds: 1500),
            );
            _fadeAnimation = Tween<double>(begin: 0.0, end: 1.0).animate(
              CurvedAnimation(parent: _controller, curve: Curves.easeIn),
            );
            _scaleAnimation = Tween<double>(begin: 0.5, end: 1.0).animate(
              CurvedAnimation(parent: _controller, curve: Curves.elasticOut),
            );
            _controller.forward();

            Future.delayed(const Duration(seconds: 3), () {
              if (mounted) {
                Navigator.of(context).pushReplacement(
                  MaterialPageRoute(builder: (_) => const MainScreen()),
                );
              }
            });
          }

          @override
          void dispose() {
            _controller.dispose();
            super.dispose();
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: Container(
                decoration: const BoxDecoration(
                  gradient: LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [Color(0xFF6A11CB), Color(0xFF2575FC)],
                  ),
                ),
                child: Center(
                  child: FadeTransition(
                    opacity: _fadeAnimation,
                    child: ScaleTransition(
                      scale: _scaleAnimation,
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          Container(
                            width: 140,
                            height: 140,
                            decoration: BoxDecoration(
                              color: Colors.white,
                              borderRadius: BorderRadius.circular(35),
                              boxShadow: [
                                BoxShadow(
                                  color: Colors.black.withOpacity(0.3),
                                  blurRadius: 30,
                                  spreadRadius: 10,
                                ),
                              ],
                            ),
                            child: const Icon(
                              Icons.apps,
                              size: 80,
                              color: Color(0xFF6A11CB),
                            ),
                          ),
                          const SizedBox(height: 30),
                          const Text(
                            'اپ‌لند',
                            style: TextStyle(
                              fontSize: 42,
                              fontWeight: FontWeight.bold,
                              color: Colors.white,
                              letterSpacing: 3,
                            ),
                          ),
                          const SizedBox(height: 10),
                          const Text(
                            'سرزمین اپ‌های تو',
                            style: TextStyle(
                              fontSize: 16,
                              color: Colors.white70,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              ),
            );
          }
        }

        class MainScreen extends StatefulWidget {
          const MainScreen({super.key});

          @override
          State<MainScreen> createState() => _MainScreenState();
        }

        class _MainScreenState extends State<MainScreen> {
          int _currentIndex = 0;

          void _goToCreateApp() {
            setState(() {
              _currentIndex = 2;
            });
          }

          @override
          Widget build(BuildContext context) {
            final pages = [
              HomePage(onStartPressed: _goToCreateApp),
              const MyAppsPage(),
              CreateAppPage(
                onAppCreated: () {
                  setState(() {
                    _currentIndex = 1;
                  });
                },
              ),
              const SettingsPage(),
            ];

            return Scaffold(
              body: pages[_currentIndex],
              bottomNavigationBar: NavigationBar(
                selectedIndex: _currentIndex,
                onDestinationSelected: (index) {
                  setState(() {
                    _currentIndex = index;
                  });
                },
                destinations: const [
                  NavigationDestination(
                    icon: Icon(Icons.home_outlined),
                    selectedIcon: Icon(Icons.home),
                    label: 'خانه',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.apps_outlined),
                    selectedIcon: Icon(Icons.apps),
                    label: 'اپ‌های من',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.add_circle_outline),
                    selectedIcon: Icon(Icons.add_circle),
                    label: 'ساخت اپ',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.settings_outlined),
                    selectedIcon: Icon(Icons.settings),
                    label: 'تنظیمات',
                  ),
                ],
              ),
            );
          }
        }

        // ==================== مدل اپ ====================
        class MyAppModel {
          final String name;
          final String welcome;
          final int colorValue;
          final String packageName;
          final String iconName;

          MyAppModel({
            required this.name,
            required this.welcome,
            required this.colorValue,
            required this.packageName,
            required this.iconName,
          });

          Map<String, dynamic> toJson() => {
                'name': name,
                'welcome': welcome,
                'color': colorValue,
                'packageName': packageName,
                'iconName': iconName,
              };

          factory MyAppModel.fromJson(Map<String, dynamic> json) => MyAppModel(
                name: json['name'] ?? '',
                welcome: json['welcome'] ?? '',
                colorValue: json['color'] ?? 0xFF6A11CB,
                packageName: json['packageName'] ?? '',
                iconName: json['iconName'] ?? 'apps',
              );
        }

        // ==================== صفحه خانه ====================
        class HomePage extends StatelessWidget {
          final VoidCallback onStartPressed;

          const HomePage({super.key, required this.onStartPressed});

          Future<void> _openRubika(String url) async {
            final uri = Uri.parse(url);
            if (await canLaunchUrl(uri)) {
              await launchUrl(uri, mode: LaunchMode.externalApplication);
            }
          }

          @override
          Widget build(BuildContext context) {
            return Container(
              decoration: const BoxDecoration(
                gradient: LinearGradient(
                  begin: Alignment.topCenter,
                  end: Alignment.bottomCenter,
                  colors: [Color(0xFF6A11CB), Color(0xFF2575FC)],
                ),
              ),
              child: SafeArea(
                child: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    children: [
                      const SizedBox(height: 40),
                      Container(
                        width: 120,
                        height: 120,
                        decoration: BoxDecoration(
                          color: Colors.white,
                          borderRadius: BorderRadius.circular(30),
                          boxShadow: [
                            BoxShadow(
                              color: Colors.black.withOpacity(0.2),
                              blurRadius: 20,
                              spreadRadius: 5,
                            ),
                          ],
                        ),
                        child: const Icon(
                          Icons.apps,
                          size: 70,
                          color: Color(0xFF6A11CB),
                        ),
                      ),
                      const SizedBox(height: 30),
                      const Text(
                        'اپ‌لند',
                        style: TextStyle(
                          fontSize: 48,
                          fontWeight: FontWeight.bold,
                          color: Colors.white,
                          letterSpacing: 2,
                        ),
                      ),
                      const SizedBox(height: 10),
                      const Text(
                        'سرزمین اپ‌های تو',
                        style: TextStyle(
                          fontSize: 18,
                          color: Colors.white70,
                        ),
                      ),
                      const SizedBox(height: 40),

                      // دکمه شروع
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton.icon(
                          onPressed: onStartPressed,
                          icon: const Icon(Icons.play_arrow, size: 28),
                          label: const Text(
                            'شروع کنید',
                            style: TextStyle(
                              fontSize: 20,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          style: ElevatedButton.styleFrom(
                            backgroundColor: Colors.white,
                            foregroundColor: const Color(0xFF6A11CB),
                            padding: const EdgeInsets.symmetric(vertical: 18),
                            shape: RoundedRectangleBorder(
                              borderRadius: BorderRadius.circular(30),
                            ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 16),

                      // دکمه مرکز آموزش (روبیکا)
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton.icon(
                          onPressed: () =>
                              _openRubika('https://rubika.ir/Appland_ir'),
                          icon: const Icon(Icons.school, size: 28),
                          label: const Text(
                            'مرکز آموزش ساخت اپ',
                            style: TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          style: ElevatedButton.styleFrom(
                            backgroundColor: Colors.white.withOpacity(0.2),
                            foregroundColor: Colors.white,
                            padding: const EdgeInsets.symmetric(vertical: 18),
                            shape: RoundedRectangleBorder(
                              borderRadius: BorderRadius.circular(30),
                              side: const BorderSide(
                                color: Colors.white,
                                width: 2,
                              ),
                            ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 16),

                      // دکمه پشتیبانی (روبیکا)
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton.icon(
                          onPressed: () =>
                              _openRubika('https://rubika.ir/support_1i'),
                          icon: const Icon(Icons.support_agent, size: 28),
                          label: const Text(
                            'پشتیبانی',
                            style: TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          style: ElevatedButton.styleFrom(
                            backgroundColor: Colors.white.withOpacity(0.2),
                            foregroundColor: Colors.white,
                            padding: const EdgeInsets.symmetric(vertical: 18),
                            shape: RoundedRectangleBorder(
                              borderRadius: BorderRadius.circular(30),
                              side: const BorderSide(
                                color: Colors.white,
                                width: 2,
                              ),
                            ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 30),
                      const Text(
                        'نسخه ۱.۰.۰',
                        style: TextStyle(
                          fontSize: 14,
                          color: Colors.white54,
                        ),
                      ),
                      const SizedBox(height: 20),
                    ],
                  ),
                ),
              ),
            );
          }
        }

        // ==================== صفحه اپ‌های من ====================
        class MyAppsPage extends StatefulWidget {
          const MyAppsPage({super.key});

          @override
          State<MyAppsPage> createState() => _MyAppsPageState();
        }

        class _MyAppsPageState extends State<MyAppsPage> {
          List<MyAppModel> _apps = [];
          bool _isLoading = true;

          @override
          void initState() {
            super.initState();
            _loadApps();
          }

          Future<void> _loadApps() async {
            final prefs = await SharedPreferences.getInstance();
            final appsJson = prefs.getStringList('my_apps') ?? [];
            setState(() {
              _apps = appsJson
                  .map((e) => MyAppModel.fromJson(jsonDecode(e)))
                  .toList();
              _isLoading = false;
            });
          }

          Future<void> _deleteApp(int index) async {
            final prefs = await SharedPreferences.getInstance();
            final appsJson = prefs.getStringList('my_apps') ?? [];
            appsJson.removeAt(index);
            await prefs.setStringList('my_apps', appsJson);
            _loadApps();
          }

          void _openUnderDevelopment() {
            Navigator.push(
              context,
              MaterialPageRoute(
                builder: (_) => const UnderDevelopmentPage(),
              ),
            );
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('اپ‌های من'),
                backgroundColor: const Color(0xFF6A11CB),
                foregroundColor: Colors.white,
              ),
              body: _isLoading
                  ? const Center(child: CircularProgressIndicator())
                  : _apps.isEmpty
                      ? const Center(
                          child: Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              Icon(Icons.apps, size: 80, color: Colors.grey),
                              SizedBox(height: 20),
                              Text(
                                'هنوز اپی نساخته‌اید',
                                style: TextStyle(
                                    fontSize: 18, color: Colors.grey),
                              ),
                              SizedBox(height: 10),
                              Text(
                                'از تب «ساخت اپ» شروع کنید',
                                style: TextStyle(
                                    fontSize: 14, color: Colors.grey),
                              ),
                            ],
                          ),
                        )
                      : ListView.builder(
                          padding: const EdgeInsets.all(16),
                          itemCount: _apps.length,
                          itemBuilder: (context, index) {
                            final app = _apps[index];
                            return Card(
                              margin: const EdgeInsets.only(bottom: 12),
                              shape: RoundedRectangleBorder(
                                borderRadius: BorderRadius.circular(16),
                              ),
                              child: ListTile(
                                leading: Container(
                                  width: 50,
                                  height: 50,
                                  decoration: BoxDecoration(
                                    color: Color(app.colorValue),
                                    borderRadius: BorderRadius.circular(12),
                                  ),
                                  child: const Icon(
                                    Icons.apps,
                                    color: Colors.white,
                                  ),
                                ),
                                title: Text(
                                  app.name,
                                  style: const TextStyle(
                                    fontWeight: FontWeight.bold,
                                    fontSize: 16,
                                  ),
                                ),
                                subtitle: Text(app.welcome),
                                trailing: Row(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    IconButton(
                                      icon: const Icon(Icons.build,
                                          color: Color(0xFF6A11CB)),
                                      onPressed: _openUnderDevelopment,
                                    ),
                                    IconButton(
                                      icon: const Icon(Icons.delete,
                                          color: Colors.red),
                                      onPressed: () => _deleteApp(index),
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        ),
            );
          }
        }

        // ==================== صفحه در حال توسعه ====================
        class UnderDevelopmentPage extends StatelessWidget {
          const UnderDevelopmentPage({super.key});

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('ساخت APK'),
                backgroundColor: const Color(0xFF6A11CB),
                foregroundColor: Colors.white,
              ),
              body: Center(
                child: Column(
                  mainAxisAlignment: MainAxisAlignment.center,
                  children: [
                    Container(
                      width: 120,
                      height: 120,
                      decoration: BoxDecoration(
                        color: const Color(0xFF6A11CB).withOpacity(0.1),
                        shape: BoxShape.circle,
                      ),
                      child: const Icon(
                        Icons.construction,
                        size: 70,
                        color: Color(0xFF6A11CB),
                      ),
                    ),
                    const SizedBox(height: 30),
                    const Text(
                      'در حال توسعه',
                      style: TextStyle(
                        fontSize: 28,
                        fontWeight: FontWeight.bold,
                        color: Color(0xFF6A11CB),
                      ),
                    ),
                    const SizedBox(height: 16),
                    const Padding(
                      padding: EdgeInsets.symmetric(horizontal: 40),
                      child: Text(
                        'این قابلیت به‌زودی اضافه می‌شود\nو می‌توانید از داخل اپ‌لند\nAPK بسازید! 🚀',
                        textAlign: TextAlign.center,
                        style: TextStyle(
                          fontSize: 16,
                          color: Colors.grey,
                          height: 1.8,
                        ),
                      ),
                    ),
                    const SizedBox(height: 30),
                    ElevatedButton.icon(
                      onPressed: () => Navigator.pop(context),
                      icon: const Icon(Icons.arrow_back),
                      label: const Text('بازگشت'),
                      style: ElevatedButton.styleFrom(
                        backgroundColor: const Color(0xFF6A11CB),
                        foregroundColor: Colors.white,
                        padding: const EdgeInsets.symmetric(
                          horizontal: 30,
                          vertical: 14,
                        ),
                        shape: RoundedRectangleBorder(
                          borderRadius: BorderRadius.circular(30),
                        ),
                      ),
                    ),
                  ],
                ),
              ),
            );
          }
        }

        // ==================== صفحه ساخت اپ ====================
        class CreateAppPage extends StatefulWidget {
          final VoidCallback onAppCreated;

          const CreateAppPage({super.key, required this.onAppCreated});

          @override
          State<CreateAppPage> createState() => _CreateAppPageState();
        }

        class _CreateAppPageState extends State<CreateAppPage> {
          final _appNameController = TextEditingController();
          final _welcomeController = TextEditingController();
          final _packageNameController = TextEditingController();
          final _iconNameController = TextEditingController();
          Color _selectedColor = const Color(0xFF6A11CB);
          bool _isLoading = false;

          final List<Color> _colors = [
            const Color(0xFF6A11CB),
            const Color(0xFF2575FC),
            const Color(0xFFFF6B6B),
            const Color(0xFF4ECDC4),
            const Color(0xFFFFA500),
            const Color(0xFF9B59B6),
          ];

          @override
          void dispose() {
            _appNameController.dispose();
            _welcomeController.dispose();
            _packageNameController.dispose();
            _iconNameController.dispose();
            super.dispose();
          }

          Future<void> _saveApp() async {
            if (_appNameController.text.isEmpty) {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('لطفاً نام اپ را وارد کنید')),
              );
              return;
            }

            if (_packageNameController.text.isEmpty) {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('لطفاً نام پکیج را وارد کنید')),
              );
              return;
            }

            setState(() {
              _isLoading = true;
            });

            final prefs = await SharedPreferences.getInstance();
            final appsJson = prefs.getStringList('my_apps') ?? [];

            final newApp = MyAppModel(
              name: _appNameController.text,
              welcome: _welcomeController.text.isEmpty
                  ? 'به ${_appNameController.text} خوش آمدید'
                  : _welcomeController.text,
              colorValue: _selectedColor.value,
              packageName: _packageNameController.text,
              iconName: _iconNameController.text.isEmpty
                  ? 'apps'
                  : _iconNameController.text,
            );

            appsJson.add(jsonEncode(newApp.toJson()));
            await prefs.setStringList('my_apps', appsJson);

            setState(() {
              _isLoading = false;
            });

            if (mounted) {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text('اپ «${_appNameController.text}» ساخته شد! 🎉'),
                ),
              );
              _appNameController.clear();
              _welcomeController.clear();
              _packageNameController.clear();
              _iconNameController.clear();
              widget.onAppCreated();
            }
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('ساخت اپ جدید'),
                backgroundColor: const Color(0xFF6A11CB),
                foregroundColor: Colors.white,
              ),
              body: SingleChildScrollView(
                padding: const EdgeInsets.all(20),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    const Text(
                      'نام اپ',
                      style:
                          TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 8),
                    TextField(
                      controller: _appNameController,
                      decoration: InputDecoration(
                        hintText: 'مثلاً: فروشگاه من',
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                        prefixIcon: const Icon(Icons.apps),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text(
                      'پیام خوش‌آمدگویی',
                      style:
                          TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 8),
                    TextField(
                      controller: _welcomeController,
                      decoration: InputDecoration(
                        hintText: 'مثلاً: به فروشگاه من خوش آمدید',
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                        prefixIcon: const Icon(Icons.message),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text(
                      'نام پکیج (Package Name)',
                      style:
                          TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 8),
                    TextField(
                      controller: _packageNameController,
                      decoration: InputDecoration(
                        hintText: 'مثلاً: com.example.myapp',
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                        prefixIcon: const Icon(Icons.code),
                        helperText: 'این نام بعد از ساخت اپ قابل تغییر نیست',
                        helperStyle: const TextStyle(
                          color: Colors.red,
                          fontSize: 12,
                        ),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text(
                      'آیکون اپ',
                      style:
                          TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 8),
                    TextField(
                      controller: _iconNameController,
                      decoration: InputDecoration(
                        hintText: 'مثلاً: shopping_cart',
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                        prefixIcon: const Icon(Icons.image),
                        helperText:
                            'نام آیکون از سایت material icons (اختیاری)',
                        helperStyle: const TextStyle(
                          color: Colors.grey,
                          fontSize: 12,
                        ),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text(
                      'رنگ اپ',
                      style:
                          TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 12),
                    Wrap(
                      spacing: 12,
                      runSpacing: 12,
                      children: _colors.map((color) {
                        return GestureDetector(
                          onTap: () {
                            setState(() {
                              _selectedColor = color;
                            });
                          },
                          child: Container(
                            width: 50,
                            height: 50,
                            decoration: BoxDecoration(
                              color: color,
                              shape: BoxShape.circle,
                              border: Border.all(
                                color: _selectedColor == color
                                    ? Colors.black
                                    : Colors.transparent,
                                width: 3,
                              ),
                            ),
                            child: _selectedColor == color
                                ? const Icon(Icons.check,
                                    color: Colors.white)
                                : null,
                          ),
                        );
                      }).toList(),
                    ),
                    const SizedBox(height: 30),
                    ElevatedButton(
                      onPressed: _isLoading ? null : _saveApp,
                      style: ElevatedButton.styleFrom(
                        backgroundColor: _selectedColor,
                        foregroundColor: Colors.white,
                        padding: const EdgeInsets.symmetric(vertical: 16),
                        shape: RoundedRectangleBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                      ),
                      child: _isLoading
                          ? const SizedBox(
                              height: 24,
                              width: 24,
                              child: CircularProgressIndicator(
                                color: Colors.white,

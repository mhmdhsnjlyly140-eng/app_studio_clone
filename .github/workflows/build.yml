name: Build AppLand APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'
          channel: 'stable'

      - name: Backup our main.dart
        run: cp lib/main.dart lib/main_backup.dart

      - name: Setup Flutter project
        run: flutter create --org ir.appland --project-name appland --platforms android .

      - name: Restore our main.dart
        run: cp lib/main_backup.dart lib/main.dart

      - name: Update Android configs
        run: |
          sed -i 's|applicationId = "ir.appland.appland"|applicationId = "ir.appland.jalili"|' android/app/build.gradle.kts || true
          sed -i 's|namespace = "ir.appland.appland"|namespace = "ir.appland.jalili"|' android/app/build.gradle.kts || true
          sed -i 's|android:label="appland"|android:label="اپ‌لند"|' android/app/src/main/AndroidManifest.xml || true
          sed -i 's|ndkVersion = flutter.ndkVersion|ndkVersion = "27.0.12077973"|' android/app/build.gradle.kts || true
          sed -i 's|minSdk = flutter.minSdkVersion|minSdk = 24|' android/app/build.gradle.kts || true

      - name: Add Permissions and Queries
        run: |
          python3 - << 'PYEOF'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          perms = '''    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
          '''
          content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + perms, content, count=1)
          queries_block = '''    <queries>
                  <package android:name="ir.mservices.market" />
                  <intent>
                      <action android:name="ir.mservices.market.InAppBillingService.BIND" />
                      <data android:mimeType="*/*" />
                  </intent>
              </queries>
          '''
          content = content.replace('<application', queries_block + '    <application', 1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF

      - name: Install deps
        run: |
          flutter pub get
          flutter pub add shared_preferences
          flutter pub add url_launcher
          flutter pub add image_picker
          flutter pub add myket_iap:1.1.12
          flutter pub add gal
          flutter pub add path_provider
          flutter pub add share_plus
          flutter pub add "file_picker:^8.1.2"
          flutter pub add video_player
          flutter pub add audioplayers

      - name: Add JitPack
        run: |
          GRADLE_FILE=android/build.gradle.kts
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's|mavenCentral()|mavenCentral()\n        maven { url = uri("https://jitpack.io") }|' $GRADLE_FILE
            sed -i 's|google()|google()\n        maven { url = uri("https://jitpack.io") }|' $GRADLE_FILE || true
          fi

      - name: Set up MainActivity for Myket Billing
        run: |
          mkdir -p android/app/src/main/kotlin/ir/appland/jalili
          cat > android/app/src/main/kotlin/ir/appland/jalili/MainActivity.kt << 'KOTLIN_EOF'
          package ir.appland.jalili
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity: FlutterFragmentActivity()
          KOTLIN_EOF

      - name: Add Myket Manifest Placeholders
        run: |
          python3 - << 'PYEOF'
          path = 'android/app/build.gradle.kts'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          placeholders = '''
                  val marketApplicationId = "ir.mservices.market"
                  val marketBindAddress = "ir.mservices.market.InAppBillingService.BIND"
                  manifestPlaceholders["marketApplicationId"] = marketApplicationId
                  manifestPlaceholders["marketBindAddress"] = marketBindAddress
                  manifestPlaceholders["marketPermission"] = "$marketApplicationId.BILLING"
          '''
          content = content.replace('defaultConfig {', 'defaultConfig {' + placeholders, 1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF

      - name: Apply Custom Icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick -qq
          convert icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Decode Keystore
        run: |
          cp appland.jks android/app/appland-release.jks

      - name: Set up Signing Config
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=appland-release.jks
          EOF
          python3 - << 'PYEOF'
          path = 'android/app/build.gradle.kts'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          signing_block = '''
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''
          content = signing_block + "\n" + content
          content = content.replace("buildTypes {", """
          signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }
          buildTypes {""")
          content = content.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF

      - name: Build APK
        run: flutter build apk --release --dart-define=MYKET_RSA_KEY=${{ secrets.MYKET_RSA_KEY }}

      - name: Align and Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" -type f | sort -V | tail -n 1)
          $ZIPALIGN -v 4 build/app/outputs/flutter-apk/app-release.apk /tmp/app-aligned.apk
          $APKSIGNER sign \
            --ks android/app/appland-release.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/app/outputs/flutter-apk/app-release-signed.apk \
            /tmp/app-aligned.apk
          mv build/app/outputs/flutter-apk/app-release-signed.apk build/app/outputs/flutter-apk/app-release.apk
          $APKSIGNER verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: appland-apk
          path: build/app/outputs/flutter-apk/app-release.apk
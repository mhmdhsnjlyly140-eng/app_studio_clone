name: Build AppLand APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0'
        channel: 'stable'

    - name: Create Flutter project
      run: |
        find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;
        flutter create --org com.appland --project-name appland .

    - name: Set NDK Version
      run: |
        GRADLE_FILE=android/app/build.gradle.kts
        if [ -f "$GRADLE_FILE" ]; then
          sed -i 's|android {|android {\n    ndkVersion = "27.0.12077973"|' $GRADLE_FILE || true
        fi

    - name: Install dependencies
      run: |
        flutter pub get
        flutter pub add shared_preferences
        flutter pub add url_launcher
        flutter pub add image_picker

    - name: Add Android permissions
      run: |
        MANIFEST=android/app/src/main/AndroidManifest.xml
        sed -i 's|<application|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <application|' $MANIFEST || true

    - name: Write AppLand main.dart
      run: |
        cat > lib/main.dart << 'DART_EOF'
        import 'package:flutter/material.dart';
        import 'package:shared_preferences/shared_preferences.dart';
        import 'package:url_launcher/url_launcher.dart';
        import 'package:image_picker/image_picker.dart';
        import 'dart:convert';
        import 'dart:io';

        // ==================== ThemeNotifier ====================
        class ThemeNotifier extends ChangeNotifier {
          bool _isDark = false;
          bool get isDark => _isDark;

          ThemeNotifier() {
            _loadTheme();
          }

          Future<void> _loadTheme() async {
            final prefs = await SharedPreferences.getInstance();
            _isDark = prefs.getBool('dark_mode') ?? false;
            notifyListeners();
          }

          Future<void> toggleTheme() async {
            _isDark = !_isDark;
            final prefs = await SharedPreferences.getInstance();
            await prefs.setBool('dark_mode', _isDark);
            notifyListeners();
          }
        }

        final themeNotifier = ThemeNotifier();

        void main() {
          runApp(const AppLand());
        }

        class AppLand extends StatelessWidget {
          const AppLand({super.key});

          @override
          Widget build(BuildContext context) {
            return AnimatedBuilder(
              animation: themeNotifier,
              builder: (context, _) {
                return MaterialApp(
                  debugShowCheckedModeBanner: false,
                  title: 'اپ‌لند',
                  themeMode:
                      themeNotifier.isDark ? ThemeMode.dark : ThemeMode.light,
                  theme: ThemeData(
                    brightness: Brightness.light,
                    primarySwatch: Colors.deepPurple,
                    useMaterial3: true,
                  ),
                  darkTheme: ThemeData(
                    brightness: Brightness.dark,
                    primarySwatch: Colors.deepPurple,
                    useMaterial3: true,
                  ),
                  home: const SplashScreen(),
                );
              },
            );
          }
        }

        // ==================== Splash Screen ====================
        class SplashScreen extends StatefulWidget {
          const SplashScreen({super.key});

          @override
          State<SplashScreen> createState() => _SplashScreenState();
        }

        class _SplashScreenState extends State<SplashScreen>
            with SingleTickerProviderStateMixin {
          late AnimationController _controller;
          late Animation<double> _fadeAnimation;
          late Animation<double> _scaleAnimation;

          @override
          void initState() {
            super.initState();
            _controller = AnimationController(
              vsync: this,
              duration: const Duration(milliseconds: 1500),
            );
            _fadeAnimation = Tween<double>(begin: 0.0, end: 1.0).animate(
              CurvedAnimation(parent: _controller, curve: Curves.easeIn),
            );
            _scaleAnimation = Tween<double>(begin: 0.5, end: 1.0).animate(
              CurvedAnimation(parent: _controller, curve: Curves.elasticOut),
            );
            _controller.forward();

            Future.delayed(const Duration(seconds: 3), () {
              if (mounted) {
                Navigator.of(context).pushReplacement(
                  MaterialPageRoute(builder: (_) => const MainScreen()),
                );
              }
            });
          }

          @override
          void dispose() {
            _controller.dispose();
            super.dispose();
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: Container(
                decoration: const BoxDecoration(
                  gradient: LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [Color(0xFF6A11CB), Color(0xFF2575FC)],
                  ),
                ),
                child: Center(
                  child: FadeTransition(
                    opacity: _fadeAnimation,
                    child: ScaleTransition(
                      scale: _scaleAnimation,
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          Container(
                            width: 140,
                            height: 140,
                            decoration: BoxDecoration(
                              color: Colors.white,
                              borderRadius: BorderRadius.circular(35),
                              boxShadow: [
                                BoxShadow(
                                  color: Colors.black.withOpacity(0.3),
                                  blurRadius: 30,
                                  spreadRadius: 10,
                                ),
                              ],
                            ),
                            child: const Icon(
                              Icons.apps,
                              size: 80,
                              color: Color(0xFF6A11CB),
                            ),
                          ),
                          const SizedBox(height: 30),
                          const Text(
                            'اپ‌لند',
                            style: TextStyle(
                              fontSize: 42,
                              fontWeight: FontWeight.bold,
                              color: Colors.white,
                              letterSpacing: 3,
                            ),
                          ),
                          const SizedBox(height: 10),
                          const Text(
                            'سرزمین اپ‌های تو',
                            style: TextStyle(
                              fontSize: 16,
                              color: Colors.white70,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              ),
            );
          }
        }

        class MainScreen extends StatefulWidget {
          const MainScreen({super.key});

          @override
          State<MainScreen> createState() => _MainScreenState();
        }

        class _MainScreenState extends State<MainScreen> {
          int _currentIndex = 0;

          void _goToCreateApp() {
            setState(() {
              _currentIndex = 2;
            });
          }

          @override
          Widget build(BuildContext context) {
            final pages = [
              HomePage(onStartPressed: _goToCreateApp),
              const MyAppsPage(),
              CreateAppPage(
                onAppCreated: () {
                  setState(() {
                    _currentIndex = 1;
                  });
                },
              ),
              const SettingsPage(),
            ];

            return Scaffold(
              body: pages[_currentIndex],
              bottomNavigationBar: NavigationBar(
                selectedIndex: _currentIndex,
                onDestinationSelected: (index) {
                  setState(() {
                    _currentIndex = index;
                  });
                },
                destinations: const [
                  NavigationDestination(
                    icon: Icon(Icons.home_outlined),
                    selectedIcon: Icon(Icons.home),
                    label: 'خانه',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.apps_outlined),
                    selectedIcon: Icon(Icons.apps),
                    label: 'اپ‌های من',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.add_circle_outline),
                    selectedIcon: Icon(Icons.add_circle),
                    label: 'ساخت اپ',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.settings_outlined),
                    selectedIcon: Icon(Icons.settings),
                    label: 'تنظیمات',
                  ),
                ],
              ),
            );
          }
        }

        // ==================== مدل اپ ====================
        class MyAppModel {
          String name;
          String welcome;
          int colorValue;
          String packageName;
          String iconPath;
          String splashText;
          String adiveryKey;
          String tapsellKey;
          String rsaKey;

          MyAppModel({
            required this.name,
            required this.welcome,
            required this.colorValue,
            required this.packageName,
            this.iconPath = '',
            this.splashText = '',
            this.adiveryKey = '',
            this.tapsellKey = '',
            this.rsaKey = '',
          });

          Map<String, dynamic> toJson() => {
                'name': name,
                'welcome': welcome,
                'color': colorValue,
                'packageName': packageName,
                'iconPath': iconPath,
                'splashText': splashText,
                'adiveryKey': adiveryKey,
                'tapsellKey': tapsellKey,
                'rsaKey': rsaKey,
              };

          factory MyAppModel.fromJson(Map<String, dynamic> json) => MyAppModel(
                name: json['name'] ?? '',
                welcome: json['welcome'] ?? '',
                colorValue: json['color'] ?? 0xFF6A11CB,
                packageName: json['packageName'] ?? '',
                iconPath: json['iconPath'] ?? '',
                splashText: json['splashText'] ?? '',
                adiveryKey: json['adiveryKey'] ?? '',
                tapsellKey: json['tapsellKey'] ?? '',
                rsaKey: json['rsaKey'] ?? '',
              );
        }

        // ==================== صفحه خانه ====================
        class HomePage extends StatelessWidget {
          final VoidCallback onStartPressed;

          const HomePage({super.key, required this.onStartPressed});

          Future<void> _openRubika(BuildContext context, String url) async {
            try {
              final uri = Uri.parse(url);
              if (await canLaunchUrl(uri)) {
                await launchUrl(uri, mode: LaunchMode.externalApplication);
                return;
              }
              final androidIntent = Uri.parse(
                'intent://rubika.ir/#Intent;scheme=https;package=ir.rubika;end',
              );
              if (await canLaunchUrl(androidIntent)) {
                await launchUrl(androidIntent);
                return;
              }
              if (context.mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text('آدرس: $url'),
                    duration: const Duration(seconds: 5),
                  ),
                );
              }
            } catch (e) {
              if (context.mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('خطا: $e')),
                );
              }
            }
          }

          @override
          Widget build(BuildContext context) {
            return Container(
              decoration: const BoxDecoration(
                gradient: LinearGradient(
                  begin: Alignment.topCenter,
                  end: Alignment.bottomCenter,
                  colors: [Color(0xFF6A11CB), Color(0xFF2575FC)],
                ),
              ),
              child: SafeArea(
                child: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    children: [
                      const SizedBox(height: 40),
                      Container(
                        width: 120,
                        height: 120,
                        decoration: BoxDecoration(
                          color: Colors.white,
                          borderRadius: BorderRadius.circular(30),
                          boxShadow: [
                            BoxShadow(
                              color: Colors.black.withOpacity(0.2),
                              blurRadius: 20,
                              spreadRadius: 5,
                            ),
                          ],
                        ),
                        child: const Icon(
                          Icons.apps,
                          size: 70,
                          color: Color(0xFF6A11CB),
                        ),
                      ),
                      const SizedBox(height: 30),
                      const Text(
                        'اپ‌لند',
                        style: TextStyle(
                          fontSize: 48,
                          fontWeight: FontWeight.bold,
                          color: Colors.white,
                          letterSpacing: 2,
                        ),
                      ),
                      const SizedBox(height: 10),
                      const Text(
                        'سرزمین اپ‌های تو',
                        style: TextStyle(
                          fontSize: 18,
                          color: Colors.white70,
                        ),
                      ),
                      const SizedBox(height: 40),
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton.icon(
                          onPressed: onStartPressed,
                          icon: const Icon(Icons.play_arrow, size: 28),
                          label: const Text(
                            'شروع کنید',
                            style: TextStyle(
                              fontSize: 20,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          style: ElevatedButton.styleFrom(
                            backgroundColor: Colors.white,
                            foregroundColor: const Color(0xFF6A11CB),
                            padding: const EdgeInsets.symmetric(vertical: 18),
                            shape: RoundedRectangleBorder(
                              borderRadius: BorderRadius.circular(30),
                            ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 16),
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton.icon(
                          onPressed: () => _openRubika(
                              context, 'https://rubika.ir/Appland_ir'),
                          icon: const Icon(Icons.school, size: 28),
                          label: const Text(
                            'مرکز آموزش ساخت اپ',
                            style: TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          style: ElevatedButton.styleFrom(
                            backgroundColor: Colors.white.withOpacity(0.2),
                            foregroundColor: Colors.white,
                            padding: const EdgeInsets.symmetric(vertical: 18),
                            shape: RoundedRectangleBorder(
                              borderRadius: BorderRadius.circular(30),
                              side: const BorderSide(
                                color: Colors.white,
                                width: 2,
                              ),
                            ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 16),
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton.icon(
                          onPressed: () => _openRubika(
                              context, 'https://rubika.ir/support_1i'),
                          icon: const Icon(Icons.support_agent, size: 28),
                          label: const Text(
                            'پشتیبانی',
                            style: TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          style: ElevatedButton.styleFrom(
                            backgroundColor: Colors.white.withOpacity(0.2),
                            foregroundColor: Colors.white,
                            padding: const EdgeInsets.symmetric(vertical: 18),
                            shape: RoundedRectangleBorder(
                              borderRadius: BorderRadius.circular(30),
                              side: const BorderSide(
                                color: Colors.white,
                                width: 2,
                              ),
                            ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 30),
                      const Text(
                        'نسخه ۱.۰.۰',
                        style: TextStyle(
                          fontSize: 14,
                          color: Colors.white54,
                        ),
                      ),
                      const SizedBox(height: 20),
                    ],
                  ),
                ),
              ),
            );
          }
        }

        // ==================== صفحه اپ‌های من ====================
        class MyAppsPage extends StatefulWidget {
          const MyAppsPage({super.key});

          @override
          State<MyAppsPage> createState() => _MyAppsPageState();
        }

        class _MyAppsPageState extends State<MyAppsPage> {
          List<MyAppModel> _apps = [];
          bool _isLoading = true;

          @override
          void initState() {
            super.initState();
            _loadApps();
          }

          @override
          void didChangeDependencies() {
            super.didChangeDependencies();
            _loadApps();
          }

          Future<void> _loadApps() async {
            final prefs = await SharedPreferences.getInstance();
            final appsJson = prefs.getStringList('my_apps') ?? [];
            if (mounted) {
              setState(() {
                _apps = appsJson
                    .map((e) => MyAppModel.fromJson(jsonDecode(e)))
                    .toList();
                _isLoading = false;
              });
            }
          }

          Future<void> _deleteApp(int index) async {
            final prefs = await SharedPreferences.getInstance();
            final appsJson = prefs.getStringList('my_apps') ?? [];
            appsJson.removeAt(index);
            await prefs.setStringList('my_apps', appsJson);
            _loadApps();
          }

          void _openAppEditor(int index) {
            Navigator.push(
              context,
              MaterialPageRoute(
                builder: (_) => AppEditorPage(appIndex: index),
              ),
            ).then((_) => _loadApps());
          }

          @override
          Widget build(BuildContext context) {
            final isDark = Theme.of(context).brightness == Brightness.dark;
            return Scaffold(
              appBar: AppBar(
                title: const Text('اپ‌های من'),
                backgroundColor: const Color(0xFF6A11CB),
                foregroundColor: Colors.white,
              ),
              body: _isLoading
                  ? const Center(child: CircularProgressIndicator())
                  : _apps.isEmpty
                      ? Center(
                          child: Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              Icon(Icons.apps,
                                  size: 80,
                                  color: isDark
                                      ? Colors.grey[600]
                                      : Colors.grey),
                              const SizedBox(height: 20),
                              Text(
                                'هنوز اپی نساخته‌اید',
                                style: TextStyle(
                                    fontSize: 18,
                                    color: isDark
                                        ? Colors.grey[400]
                                        : Colors.grey),
                              ),
                              const SizedBox(height: 10),
                              Text(
                                'از تب «ساخت اپ» شروع کنید',
                                style: TextStyle(
                                    fontSize: 14,
                                    color: isDark
                                        ? Colors.grey[500]
                                        : Colors.grey),
                              ),
                            ],
                          ),
                        )
                      : ListView.builder(
                          padding: const EdgeInsets.all(16),
                          itemCount: _apps.length,
                          itemBuilder: (context, index) {
                            final app = _apps[index];
                            return Card(
                              margin: const EdgeInsets.only(bottom: 12),
                              shape: RoundedRectangleBorder(
                                borderRadius: BorderRadius.circular(16),
                              ),
                              child: ListTile(
                                leading: Container(
                                  width: 50,
                                  height: 50,
                                  decoration: BoxDecoration(
                                    color: Color(app.colorValue),
                                    borderRadius: BorderRadius.circular(12),
                                  ),
                                  child: app.iconPath.isNotEmpty
                                      ? ClipRRect(
                                          borderRadius:
                                              BorderRadius.circular(12),
                                          child: Image.file(
                                            File(app.iconPath),
                                            fit: BoxFit.cover,
                                            errorBuilder: (_, __, ___) =>
                                                const Icon(
                                              Icons.apps,
                                              color: Colors.white,
                                            ),
                                          ),
                                        )
                                      : const Icon(
                                          Icons.apps,
                                          color: Colors.white,
                                        ),
                                ),
                                title: Text(
                                  app.name,
                                  style: const TextStyle(
                                    fontWeight: FontWeight.bold,
                                    fontSize: 16,
                                  ),
                                ),
                                subtitle: Text(app.welcome),
                                trailing: Row(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    IconButton(
                                      icon: const Icon(Icons.build,
                                          color: Color(0xFF6A11CB)),
                                      onPressed: () => _openAppEditor(index),
                                    ),
                                    IconButton(
                                      icon: const Icon(Icons.delete,
                                          color: Colors.red),
                                      onPressed: () => _deleteApp(index),
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        ),
            );
          }
        }

        // ==================== صفحه ویرایش اپ (با ۴ تب) ====================
        class AppEditorPage extends StatefulWidget {
          final int appIndex;

          const AppEditorPage({super.key, required this.appIndex});

          @override
          State<AppEditorPage> createState() => _AppEditorPageState();
        }

        class _AppEditorPageState extends State<AppEditorPage> {
          MyAppModel? _app;

          @override
          void initState() {
            super.initState();
            _loadApp();
          }

          Future<void> _loadApp() async {
            final prefs = await SharedPreferences.getInstance();
            final appsJson = prefs.getStringList('my_apps') ?? [];
            if (widget.appIndex < appsJson.length) {
              setState(() {
                _app = MyAppModel.fromJson(
                    jsonDecode(appsJson[widget.appIndex]));
              });
            }
          }

          Future<void> _saveApp() async {
            if (_app == null) return;
            final prefs = await SharedPreferences.getInstance();
            final appsJson = prefs.getStringList('my_apps') ?? [];
            appsJson[widget.appIndex] = jsonEncode(_app!.toJson());
            await prefs.setStringList('my_apps', appsJson);
          }

          @override
          Widget build(BuildContext context) {
            if (_app == null) {
              return const Scaffold(
                body: Center(child: CircularProgressIndicator()),
              );
            }

            return DefaultTabController(
              length: 4,
              child: Scaffold(
                appBar: AppBar(
                  title: Text(_app!.name),
                  backgroundColor: const Color(0xFF6A11CB),
                  foregroundColor: Colors.white,
                  bottom: const TabBar(
                    isScrollable: true,
                    indicatorColor: Colors.white,
                    labelColor: Colors.white,
                    unselectedLabelColor: Colors.white70,
                    tabs: [
                      Tab(icon: Icon(Icons.build), text: 'ساخت'),
                      Tab(icon: Icon(Icons.campaign), text: 'تبلیغات'),
                      Tab(icon: Icon(Icons.payment), text: 'پرداخت'),
                      Tab(icon: Icon(Icons.settings), text: 'تنظیمات'),
                    ],
                  ),
                ),
                body: TabBarView(
                  children: [
                    _buildTab(),
                    _adsTab(),
                    _paymentTab(),
                    _settingsTab(),
                  ],
                ),
              ),
            );
          }

          // ========== تب ساخت ==========
          Widget _buildTab() {
            return ListView(
              padding: const EdgeInsets.all(16),
              children: [
                _cardTile(
                  icon: Icons.preview,
                  title: 'پیش‌نمایش',
                  subtitle: 'مشاهده پیش‌نمایش اپ',
                  onTap: () {
                    Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) => PreviewPage(app: _app!),
                      ),
                    );
                  },
                ),
                _cardTile(
                  icon: Icons.android,
                  title: 'خروجی APK',
                  subtitle: 'ساخت فایل نصب اندروید',
                  onTap: () {
                    Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) => const UnderDevelopmentPage(),
                      ),
                    );
                  },
                ),
                _cardTile(
                  icon: Icons.dashboard_customize,
                  title: 'ساخت صفحات اپ',
                  subtitle: 'افزودن صفحه به اپ',
                  onTap: () {
                    Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) => const UnderDevelopmentPage(),
                      ),
                    );
                  },
                ),
                _cardTile(
                  icon: Icons.wallpaper,
                  title: 'Splash Screen',
                  subtitle: 'صفحه شروع اپ',
                  onTap: () {
                    _showSplashDialog();
                  },
                ),
              ],
            );
          }

          void _showSplashDialog() {
            final controller = TextEditingController(text: _app!.splashText);
            showDialog(
              context: context,
              builder: (context) => AlertDialog(
                title: const Text('Splash Screen'),
                content: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    const Text('متن روی صفحه شروع اپ را وارد کنید:'),
                    const SizedBox(height: 12),
                    TextField(
                      controller: controller,
                      decoration: InputDecoration(
                        hintText: 'مثلاً: به فروشگاه من خوش آمدید',
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                      ),
                    ),
                  ],
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(context),
                    child: const Text('لغو'),
                  ),
                  ElevatedButton(
                    onPressed: () {
                      setState(() {
                        _app!.splashText = controller.text;
                      });
                      _saveApp();
                      Navigator.pop(context);
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text('ذخیره شد! ✅')),
                      );
                    },
                    style: ElevatedButton.styleFrom(
                      backgroundColor: const Color(0xFF6A11CB),
                    ),
                    child: const Text('ذخیره'),
                  ),
                ],
              ),
            );
          }

          // ========== تب تبلیغات ==========
          Widget _adsTab() {
            return ListView(
              padding: const EdgeInsets.all(16),
              children: [
                const Text(
                  'سرویس تبلیغاتی ادیوری',
                  style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                ),
                const SizedBox(height: 8),
                TextField(
                  controller: TextEditingController(text: _app!.adiveryKey),
                  onChanged: (v) {
                    _app!.adiveryKey = v;
                  },
                  decoration: InputDecoration(

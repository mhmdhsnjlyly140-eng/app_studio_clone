name: Build AppLand APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'
          channel: 'stable'

      - name: Save main.dart and create Flutter project
        run: |
          mkdir -p /tmp/appland_source
          cp lib/main.dart /tmp/appland_source/main.dart
          rm -rf lib android ios web test .dart_tool build pubspec.yaml pubspec.lock analysis_options.yaml .metadata
          flutter create --org ir.appland --project-name jalili --platforms android .
          cp /tmp/appland_source/main.dart lib/main.dart
          echo "=== محتوای main.dart ==="
          head -20 lib/main.dart

      - name: Set up MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/ir/appland/jalili
          cat > android/app/src/main/kotlin/ir/appland/jalili/MainActivity.kt << 'KOTLIN_EOF'
          package ir.appland.jalili
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity: FlutterFragmentActivity()
          KOTLIN_EOF

      - name: Install deps
        run: |
          flutter pub get
          flutter pub add shared_preferences
          flutter pub add url_launcher
          flutter pub add image_picker

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/appland.jks
          ls -la android/app/appland.jks

      - name: Build APK
        run: flutter build apk --release

      - name: Sign APK
        run: |
          cd build/app/outputs/flutter-apk
          zip -d app-release.apk "META-INF/*.SF" "META-INF/*.DSA" "META-INF/*.RSA" || true
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore ../../../../android/app/appland.jks \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_ALIAS_PASSWORD }} \
            app-release.apk \
            ${{ secrets.KEY_ALIAS }}

      - name: Verify Signature
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: appland-apk
          path: build/app/outputs/flutter-apk/app-release.apk

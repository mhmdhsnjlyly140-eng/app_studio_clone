name: Build and Distribute APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0'
        channel: 'stable'

    - name: Create Flutter project
      run: |
        # حذف فایل‌های قبلی (به جز .git)
        find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;
        # ایجاد یک پروژه فلاتر جدید
        flutter create --org com.example --project-name my_app .

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

    - name: Sign APK
      run: |
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore keystore.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
          -keypass ${{ secrets.KEY_ALIAS_PASSWORD }} \
          build/app/outputs/flutter-apk/app-release-unsigned.apk \
          ${{ secrets.KEY_ALIAS }}

    - name: Align APK
      run: |
        sudo apt-get update
        sudo apt-get install -y google-android-build-tools-33-installer
        zipalign -v -p 4 \
          build/app/outputs/flutter-apk/app-release-unsigned.apk \
          build/app/outputs/flutter-apk/app-release.apk

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-signed-app
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7

name: Build AppLand APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'
          channel: 'stable'

      - name: Backup our main.dart
        run: cp lib/main.dart lib/main_backup.dart

      - name: Setup Flutter project
        run: flutter create --org ir.appland --project-name appland --platforms android .

      - name: Restore our main.dart
        run: cp lib/main_backup.dart lib/main.dart

      - name: Update Android configs
        run: |
          sed -i 's|applicationId = "ir.appland.appland"|applicationId = "ir.appland.jalili"|' android/app/build.gradle.kts || true
          sed -i 's|namespace = "ir.appland.appland"|namespace = "ir.appland.jalili"|' android/app/build.gradle.kts || true
          sed -i 's|android:label="appland"|android:label="اپ‌لند"|' android/app/src/main/AndroidManifest.xml || true
          sed -i 's|ndkVersion = flutter.ndkVersion|ndkVersion = "27.0.12077973"|' android/app/build.gradle.kts || true
          sed -i 's|minSdk = flutter.minSdkVersion|minSdk = 24|' android/app/build.gradle.kts || true

      - name: Add Permissions
        run: |
          python3 - << 'PYEOF'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          perms = '''    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
          '''
          content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + perms, content, count=1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF

      - name: Install deps
        run: flutter pub get

      - name: Add JitPack
        run: |
          GRADLE_FILE=android/build.gradle.kts
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's|repositories {|repositories {\n        maven { url = uri("https://jitpack.io") }|' $GRADLE_FILE
          fi

      - name: Set up MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/ir/appland/jalili
          cat > android/app/src/main/kotlin/ir/appland/jalili/MainActivity.kt << 'KOTLIN_EOF'
          package ir.appland.jalili
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity: FlutterFragmentActivity()
          KOTLIN_EOF

      - name: Apply Custom Icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick -qq
          convert icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Decode Keystore
        run: |
          cp appland.jks android/app/appland-release.jks

      - name: Set up Signing Config
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=appland-release.jks
          EOF
          python3 - << 'PYEOF'
          path = 'android/app/build.gradle.kts'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          signing_block = '''
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''
          content = signing_block + "\n" + content
          content = content.replace("buildTypes {", """
          signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }
          buildTypes {""")
          content = content.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF

      - name: Build APK
        run: flutter build apk --release --dart-define=BAZAAR_RSA_KEY=${{ secrets.BAZAAR_RSA_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: appland-apk
          path: build/app/outputs/flutter-apk/app-release.apk